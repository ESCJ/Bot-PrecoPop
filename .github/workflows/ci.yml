name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  quality:
    name: Lint, typecheck e testes unitários
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Formatação
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes unitários
        run: npm test

      - name: Build
        run: npm run build

      - name: Verificar que as migrations foram para o dist
        run: test -n "$(ls dist/infra/db/migrations/*.sql)"

  integration:
    name: Testes de integração (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: precopop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      LOG_LEVEL: silent
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/precopop_test
      DATABASE_SSL: "false"
      DATABASE_POOL_MAX: "5"
      TELEGRAM_BOT_TOKEN: "0000000000:TEST-TOKEN-PARA-CI-SOMENTE"
      TELEGRAM_WEBHOOK_SECRET: "ci-secret-token-123"
      ADMIN_CHAT_IDS: "1"
      SHIPPING_GROUP_CHAT_ID: "-1001"
      MERCADO_PAGO_ACCESS_TOKEN: "TEST-ci-access-token"
      MERCADO_PAGO_WEBHOOK_SECRET: "ci-webhook-secret"
      PUBLIC_URL: "http://localhost:3000"
      PORT: "3000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Aplicar migrations
        run: npm run migrate

      - name: Testes de integração
        run: npm run test:integration

  docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: preco-pop-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
